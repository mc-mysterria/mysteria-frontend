<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" href="/logo.webp"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Defaults for first paint; useSeo.ts replaces these per route. -->
    <meta
            name="title"
            content="Mysterria — Lord of the Mysteries Minecraft Server | Pathways, Potions, Sequences"
    />
    <meta
            name="description"
            content="A Lord of the Mysteries Minecraft server with the full Beyonder system: 22 Pathways, brewing, rituals and the Sequence 9 to 0 climb. Java and Bedrock, free to join, English and Ukrainian."
    />
    <link rel="canonical" href="https://mysterria.net/"/>
    <meta name="theme-color" content="#05070a"/>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Mysterria"/>
    <meta property="og:url" content="https://mysterria.net/"/>
    <meta
            property="og:title"
            content="Mysterria — Lord of the Mysteries Minecraft Server"
    />
    <meta
            property="og:description"
            content="Drink the potion. Act the role. Climb 22 Beyonder Pathways from Sequence 9 toward godhood on a Lord of the Mysteries Minecraft server."
    />
    <meta property="og:image" content="https://mysterria.net/banner.webp"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:image:alt" content="Mysterria — a Lord of the Mysteries Minecraft server"/>
    <meta property="og:locale" content="en_US"/>
    <meta property="og:locale:alternate" content="uk_UA"/>

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:url" content="https://mysterria.net/"/>
    <meta
            name="twitter:title"
            content="Mysterria — Lord of the Mysteries Minecraft Server"
    />
    <meta
            name="twitter:description"
            content="Drink the potion. Act the role. Climb 22 Beyonder Pathways from Sequence 9 toward godhood on a Lord of the Mysteries Minecraft server."
    />
    <meta name="twitter:image" content="https://mysterria.net/banner.webp"/>

    <!-- Icons: self-hosted FA subset, imported from main.ts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Inter (body), Playfair Display (headings), JetBrains Mono (labels), one
         request so the Cyrillic subsets come along for the Ukrainian locale. -->
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap"
            rel="stylesheet">

    <!-- LCP image: the hero paints it via a bound background-image, which the
         preload scanner cannot discover on its own. Vite hashes this href. -->
    <link rel="preload" as="image" type="image/webp" href="/src/assets/images/optimized/Klein.webp">

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://api.mysterria.net">
    <link rel="preconnect" href="https://catwalk.mysterria.net">

    <!-- Critical CSS for font loading optimization -->
    <style>
        /* Use Inter font with system fallbacks */
        :root {
            --font-primary: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-display: "Playfair Display", Georgia, serif;
        }

        body {
            font-family: var(--font-primary);
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
    </style>

    <!-- No custom font loading script needed - Inter loads fast with display=swap -->

    <title>Mysterria - Lord of The Mysteries Minecraft Server</title>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
<!-- Declared statically so it survives without JS; useSeo references these @ids. -->
<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Organization",
                "@id": "https://mysterria.net/#organization",
                "name": "Mysterria",
                "url": "https://mysterria.net/",
                "logo": "https://mysterria.net/logo.webp",
                "description": "Mysterria is a Lord of the Mysteries inspired Minecraft server with a custom Beyonder system: 22 Pathways, potions, rituals and a Sequence 9 to 0 climb.",
                "sameAs": [
                    "https://discord.com/invite/jc7GSxBWgb",
                    "https://wiki.mysterria.net/",
                    "https://map.mysterria.net/",
                    "https://docs.mysterria.net/",
                    "https://github.com/ikeepcalm/coi-client",
                    "https://modrinth.com/mod/coi-client",
                    "https://www.curseforge.com/minecraft/mc-mods/coi-client"
                ]
            },
            {
                "@type": "WebSite",
                "@id": "https://mysterria.net/#website",
                "url": "https://mysterria.net/",
                "name": "Mysterria",
                "alternateName": "Mysterria Minecraft Server",
                "inLanguage": [
                    "en",
                    "uk"
                ],
                "publisher": {
                    "@id": "https://mysterria.net/#organization"
                }
            }
        ]
    }
</script>
</body>
</html>
