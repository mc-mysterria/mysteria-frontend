# Regenerates Traditional Chinese on Crowdin's own branch.

name: Crowdin regenerate

on:
  push:
    branches:
      - l10n_main
      - "l10n_**"

permissions:
  contents: write

concurrency:
  group: crowdin-regenerate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npm run build:zh-tw

      - name: Commit regenerated Traditional Chinese
        run: |
          if git diff --quiet; then
            echo "Traditional Chinese already in step with Simplified - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate Traditional Chinese from Simplified"
          git push
